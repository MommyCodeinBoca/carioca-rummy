<html><body style="margin:0">
<!-- Carioca's icon: the red-and-gold back from the table, with a joker beside
     it, on the same bright felt the game is played on. -->
<div style="width:1024px;height:1024px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 40% 30%, #2bb02b 0%, #1a8f1a 45%, #0d6b14 100%);
  font-family:Georgia,'Times New Roman',serif;">
  <div style="position:relative;width:640px;height:640px;">
    <!-- the card back -->
    <div style="position:absolute;left:30px;top:70px;width:380px;height:530px;border-radius:34px;
      transform:rotate(-15deg);box-shadow:0 24px 60px rgba(0,0,0,.55);
      border:16px solid #f0c430;
      background:
        repeating-linear-gradient(45deg, rgba(240,196,48,.55) 0 7px, transparent 7px 24px),
        repeating-linear-gradient(-45deg, rgba(240,196,48,.55) 0 7px, transparent 7px 24px),
        linear-gradient(160deg,#a81d20,#7d1316);">
      <div style="position:absolute;inset:0;margin:auto;width:46%;height:32%;border-radius:50%;
        background:radial-gradient(circle at 35% 30%,#d8332f,#7d1316);border:9px solid #f0c430;
        display:flex;align-items:center;justify-content:center;color:#fff6d8;
        font-weight:700;font-size:150px;">C</div>
    </div>
    <!-- the joker -->
    <div style="position:absolute;left:210px;top:40px;width:380px;height:530px;border-radius:34px;
      transform:rotate(9deg);box-shadow:0 24px 60px rgba(0,0,0,.55);
      background:linear-gradient(140deg,#fffdf6,#f3e9ff);border:5px solid #c9c2d8;
      display:flex;align-items:center;justify-content:center;">
      <span style="font-size:300px;line-height:1;">🃏</span>
    </div>
  </div>
</div></body></html>
