# Cloudflare deployment config.
#
# The dashboard created this project as a WORKERS project, not a Pages one —
# Cloudflare's current flow steers you there — and a Workers project deploys
# with `npx wrangler deploy`, which reads this file. Without it the first build
# failed with:
#
#   ✘ [ERROR] Could not detect a directory containing static files
#
# …because it went straight to deploying without ever running the build, and
# `pwa/` is generated output that is not in the repository.
#
# So two things have to be true, and only one of them lives here:
#   1. the dashboard's BUILD COMMAND must be `./pwa.sh carioca.html`
#      (Settings ▸ Build ▸ Build command) — that is what creates ./pwa
#   2. this file points the deploy at that folder
#
# `name` MUST match the project name in the Cloudflare dashboard. If they
# differ, wrangler deploys to a different Worker than the one you set up and
# the site you are looking at never changes.

name = "carioca-rummy"
compatibility_date = "2026-08-23"

# Build here rather than in the dashboard.
#
# wrangler runs this before deploying, so `npx wrangler deploy` becomes the
# whole job: build, then upload what was built. Two reasons to keep it in the
# file instead of a settings page:
#
#   · the dashboard's build-command field is easy to miss — it is what was
#     missing on the first attempt, and the failure it produces ("Could not
#     detect a directory containing static files") says nothing about a build
#     never having run
#   · the way the site is built then travels with the repository, so it is
#     reviewable, and it cannot silently differ from what is committed
[build]
command = "./pwa.sh carioca.html"

# A static site: no Worker script, just files. `pwa` is what pwa.sh builds —
# the game, the manifest, the service worker, the icons and the _headers file.
[assets]
directory = "./pwa"

# Both are generated by pwa.sh, so they travel with the build rather than living
# in a provider's dashboard:
#   _headers   sw.js must never be cached, or a stale service worker keeps
#              serving an old game forever and redeploying reaches nobody who
#              has already visited.
